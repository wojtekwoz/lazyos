name: lazyos-mixpost

services:
  mixpost:
    image: inovector/mixpost:latest
    restart: unless-stopped
    ports:
      - "${LAZYOS_PORT}:80"
    environment:
      APP_NAME: Mixpost
      APP_KEY: "${LAZYOS_APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "http://localhost:${LAZYOS_PORT}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: mixpost
      DB_USERNAME: mixpost
      DB_PASSWORD: mixpost
      REDIS_HOST: redis
      BROADCAST_DRIVER: log
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - mixpost-data:/var/www/html/storage/app

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mixpost
      MYSQL_USER: mixpost
      MYSQL_PASSWORD: mixpost
    volumes:
      - mixpost-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - mixpost-redis:/data

volumes:
  mixpost-data:
  mixpost-mysql:
  mixpost-redis:
